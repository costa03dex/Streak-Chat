<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STREAK CHAT 🔥</title>
<style>
:root{--bg:#0f0720;--p:#8b5cf6;--l:#c4b5fd;--g:rgba(255,255,255,.07);--b:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#f3eeff;height:100dvh;overflow:hidden;
background:radial-gradient(circle at 15% 0,#3b1a7a,transparent 50%),radial-gradient(circle at 95% 100%,#5b21b6,transparent 45%),var(--bg)}
button,input,select{font:inherit;color:inherit}
.glass{background:var(--g);border:1px solid var(--b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px}
#app{display:none;height:100dvh;padding:12px;gap:12px;position:relative}#app.on{display:flex}
aside{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:14px}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px;background:linear-gradient(90deg,#fff,var(--l));-webkit-background-clip:text;background-clip:text;color:transparent}
#conn{font-size:12px;color:#fca5a5;display:flex;align-items:center;gap:5px}#conn i{width:8px;height:8px;border-radius:50%;background:#f87171}
#conn.ok{color:#86efac}#conn.ok i{background:#4ade80;box-shadow:0 0 8px #4ade80}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(139,92,246,.18);cursor:pointer;border:0;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#7c3aed,#c084fc);flex-shrink:0}
input,select{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--b);background:rgba(0,0,0,.25);outline:none}
input:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(139,92,246,.3)}
.btn{padding:11px 14px;border:0;border-radius:14px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,#7c3aed,#a855f7);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.alt{background:var(--g);border:1px solid var(--b)}.btn.sm{padding:6px 12px;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;cursor:pointer;transition:background .15s}
.row:hover,.row.act{background:rgba(139,92,246,.22)}
.mid{flex:1;min-width:0}.mid small,.mut{color:#b9a9e0;display:block}.mid small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:#f43f5e;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.fire{font-size:13px;font-weight:700;color:#8d7bb5}.fire.on{color:#fb923c;text-shadow:0 0 10px #f97316}
#empty{margin:auto;text-align:center;padding:30px}#empty b{font-size:46px;display:block}
#room{display:flex;flex-direction:column;height:100%}#room[hidden],#empty[hidden]{display:none}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--b)}
.head .mid{flex:1}.head small{display:block;color:#b9a9e0;font-size:12px}
.ib{background:none;border:0;font-size:19px;cursor:pointer;padding:6px;border-radius:10px}.ib:hover{background:var(--g)}
.back{display:none}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(75%,520px);padding:8px 12px;border-radius:16px 16px 16px 4px;background:rgba(255,255,255,.1);align-self:flex-start;word-break:break-word;animation:pop .2s ease}
.msg.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#7c3aed,#a855f7);width:auto;padding:8px 12px;cursor:default;border:0}
.msg .who{color:var(--l);font-weight:700;font-size:12px;display:block}.msg .t{display:block;text-align:right;font-size:11px;opacity:.7}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.bar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--b);position:relative}
#emo{position:absolute;bottom:64px;left:12px;display:none;flex-wrap:wrap;width:260px;padding:8px;background:#1b0f3a;border:1px solid var(--b);border-radius:14px;z-index:5}
#emo.on{display:flex}#emo button{background:none;border:0;font-size:22px;padding:4px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(5,0,15,.65);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:20;padding:14px}
.box{background:#1b0f3a;width:min(440px,100%);max-height:88dvh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;animation:pop .25s ease}
.ics{display:flex;flex-wrap:wrap;gap:6px}.ics button{font-size:22px;background:var(--g);border:2px solid transparent;border-radius:12px;padding:4px 8px;cursor:pointer}.ics button.sel{border-color:var(--p)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#3b1a7a;border:1px solid var(--p);padding:10px 16px;border-radius:14px;z-index:50;max-width:90vw;animation:pop .25s}
.toast.err{background:#7f1d3a;border-color:#f43f5e}
@media(max-width:760px){#app{padding:0;gap:0}aside,main{position:absolute;inset:0;width:100%;border-radius:0;height:100dvh}
main{transform:translateX(100%);transition:transform .3s}#app.chat main{transform:none}.back{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--b);background:rgba(0,0,0,.25);outline:none;resize:none;max-height:120px;font:inherit;color:inherit}
textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(139,92,246,.3)}
.bar{align-items:flex-end}#emo{bottom:70px}
.av{overflow:hidden}.av img,.pv img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.av.big{width:96px;height:96px;font-size:50px;border-radius:30px;margin:0 auto 8px;box-shadow:0 0 28px rgba(168,85,247,.6)}
.msg{position:relative}.msg.mine{align-self:flex-end;border-radius:16px 16px 4px 16px;background:linear-gradient(135deg,#7c3aed,#a855f7)}
.msg .pic{display:block;max-width:100%;max-height:300px;border-radius:12px;margin:4px 0;cursor:zoom-in;min-height:40px;min-width:120px;background:rgba(0,0,0,.2)}
.who i{opacity:.6;font-style:normal;font-weight:400}.rq{border-left:3px solid var(--l);padding:2px 8px;font-size:12px;opacity:.85;margin-bottom:4px}
.mini{display:inline-block;width:18px;height:18px;border-radius:6px;overflow:hidden;vertical-align:middle;text-align:center;font-size:13px;line-height:18px}.mini img{width:100%;height:100%;object-fit:cover}
.rx{display:flex;gap:4px;flex-wrap:wrap}.rx:empty{display:none}.rx button,.acts button{background:rgba(0,0,0,.25);border:1px solid var(--b);border-radius:99px;padding:1px 8px;cursor:pointer;margin-top:4px}
.rx button.on{border-color:var(--l);background:rgba(196,181,253,.25)}
.acts{display:none;position:absolute;top:-18px;right:6px;background:#1b0f3a;border:1px solid var(--b);border-radius:12px;padding:2px 4px;gap:2px;z-index:3}
.acts button{border:0;margin:0;background:none;padding:2px 5px}.msg:hover .acts,.msg.tap .acts{display:flex}.acts.rp{top:-52px;display:flex}
.pv{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;border-top:1px solid var(--b)}.pv img{height:70px;width:auto;border-radius:10px}
.pv button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--l)}#prev[hidden]{display:none}.row2{display:flex;gap:8px}
</style>
</head>
<body>
<div id="app">
 <aside class="glass">
  <div class="top"><span class="logo">🔥 STREAK CHAT</span><span id="conn"><i></i><span>Conectando…</span></span></div>
  <button class="me" id="meBtn" title="Editar perfil"><div class="av" id="meAv"></div><div class="mid"><b id="meName"></b><small>Editar perfil</small></div></button>
  <input id="q" placeholder="🔍 Pesquisar conversas">
  <div class="two"><button class="btn" id="bNew">✉️ Nova conversa</button><button class="btn alt" id="bExp">🌐 Grupos</button></div>
  <div id="list"></div>
 </aside>
 <main class="glass">
  <div id="empty"><b>🔥</b><h2>Mantenha a chama acesa</h2><p class="mut">Abra uma conversa ou entre em um grupo.</p></div>
  <div id="room" hidden>
   <div class="head">
    <button class="ib back" id="bBack">←</button><div class="av" id="hav"></div>
    <div class="mid"><b id="htitle"></b><small id="hsub"></small></div>
    <div id="hfire" style="text-align:right"></div>
    <button class="ib" id="bMem" title="Participantes">👥</button><button class="ib" id="bBlock" title="Bloquear/desbloquear">🚫</button>
    <button class="ib" id="bMute" title="Silenciar">🔔</button><button class="ib" id="bLeave" title="Sair">🚪</button>
   </div>
   <div id="msgs"></div>
   <div id="prev" hidden></div><div class="bar"><div id="emo"></div><button class="ib" id="bEmo">😊</button><button class="ib" id="bAtt" title="Anexar imagem">📎</button><input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><textarea id="inp" rows="1" maxlength="2000" placeholder="Escreva uma mensagem… (Enter envia, Shift+Enter quebra linha)" autocomplete="off"></textarea><button class="btn" id="bSend">Enviar</button></div>
  </div>
 </main>
</div>

<script>
function showErr(t){var d=document.createElement('div');d.style.cssText='position:fixed;inset:auto 12px 12px 12px;z-index:99;background:#7f1d3a;color:#fff;padding:14px;border-radius:14px;font:14px system-ui;word-break:break-word';d.textContent='Erro: '+t;document.body.appendChild(d)}
addEventListener('error',function(e){showErr(e.target&&e.target.src?'não carregou '+e.target.src:e.message)},true);
addEventListener('unhandledrejection',function(e){showErr(e.reason&&e.reason.message||e.reason)});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIGURE AQUI (Supabase > Project Settings > API) ====== */
const SB_URL = 'https://nzpampqzpzownpnngtsp.supabase.co';      // ex: https://abcd1234.supabase.co
const SB_KEY = 'sb_publishable_zr6YITIzxhQdjBFCtwqGpA_iQMWCxCv';  // anon / publishable key (NUNCA a service_role)
/* ================================================================ */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS=['😀','😎','🦊','🐼','🦄','🌙','⚡','🔥','🎧','🌸','👾','🐱'];
const EMO=['😀','😂','😍','🥰','😎','🤔','😢','😡','👍','🙏','🔥','🎉','💜','✨','👀','🙌'];
let sb,me,chats=[],cur=null,cache={},blocked=new Set(),loading=false;

function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function modal(html,lock){document.querySelectorAll('.ov[data-m]').forEach(o=>o.remove());
 const m=document.createElement('div');m.className='ov';m.dataset.m=1;m.innerHTML=`<div class="glass box">${html}</div>`;
 if(!lock)m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const hm=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function left(ts){const ms=new Date(ts)-Date.now();if(ms<=0)return 'agora';const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h?`${h}h ${m}min`:`${m}min`}
function setConn(ok){const c=$('#conn');c.className=ok?'ok':'';c.lastChild.textContent=ok?'Conectado':'Reconectando…'}

/* ---------- entrada sem cadastro ---------- */
function welcome(edit){
 let av=edit?me.avatar:ICONS[0];
 const m=modal(`<h2>${edit?'Seu perfil':'🔥 STREAK CHAT'}</h2><p class="mut">${edit?'Troque seu nome ou avatar.':'Escolha um nome e comece a conversar. Sem e-mail, sem senha.'}</p>
 <input id="un" maxlength="24" placeholder="Nome de usuário" value="${edit?esc(me.username):''}">
 <div class="ics">${ICONS.map(i=>`<button data-i="${i}" class="${i===av?'sel':''}">${i}</button>`).join('')}</div>
 <button class="btn" id="go">${edit?'Salvar':'Entrar'}</button>`,!edit);
 const q=s=>m.querySelector(s);
 q('.ics').onclick=e=>{const b=e.target.closest('button');if(!b)return;av=b.dataset.i;m.querySelectorAll('.ics button').forEach(x=>x.classList.toggle('sel',x===b))};
 const go=async()=>{const u=q('#un').value.trim();if(u.length<2)return toast('O nome precisa ter pelo menos 2 caracteres',1);
  q('#go').disabled=true;
  try{let {data:{session}}=await sb.auth.getSession();
   if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
   const {data,error}=await sb.from('profiles').upsert({id:session.user.id,username:u,avatar:av}).select().single();
   if(error)throw error;me=data;m.remove();
   if(edit){$('#meName').textContent=me.username;$('#meAv').textContent=me.avatar;toast('Perfil atualizado')}else start()}
  catch(e){toast(e.code==='23505'?'Esse nome já está em uso. Escolha outro.':'Não foi possível entrar: '+e.message,1);q('#go').disabled=false}};
 q('#go').onclick=go;q('#un').onkeydown=e=>e.key==='Enter'&&go();q('#un').focus();
}

/* ---------- lista de conversas ---------- */
async function loadChats(){
 const {data,error}=await sb.rpc('my_chats');if(error)return toast('Erro ao carregar conversas: '+error.message,1);
 chats=data;drawList();
 if(cur){const c=chats.find(x=>x.id===cur.id);if(c){cur=c;drawHead()}}
}
function drawList(){
 const q=$('#q').value.toLowerCase(),l=chats.filter(c=>(c.title||'').toLowerCase().includes(q));
 $('#list').innerHTML=l.length?l.map(c=>`<div class="row ${cur&&cur.id===c.id?'act':''}" data-id="${c.id}"><div class="av">${esc(c.icon)}</div>
 <div class="mid"><b>${esc(c.title)}</b> ${c.streak?`<span class="fire on">🔥${c.streak}</span>`:''}<small>${esc(c.last_content||'Sem mensagens ainda')}</small></div>
 ${c.muted?'🔕':''}${c.unread&&!c.muted?`<span class="badge">${c.unread}</span>`:''}</div>`).join('')
 :'<p class="mut" style="padding:12px">Nada por aqui ainda. Inicie uma conversa ou explore grupos.</p>';
}
function drawHead(){
 const c=cur;$('#hav').textContent=c.icon;$('#htitle').textContent=c.title;
 $('#hsub').textContent=c.kind==='group'?`${c.members} participantes`:'Conversa privada';
 $('#hfire').title=c.kind==='group'?'Regra: 2 pessoas diferentes precisam enviar mensagem no dia':'Regra: as duas pessoas precisam enviar mensagem no dia';
 $('#hfire').innerHTML=c.streak>0?`<span class="fire on">🔥 ${c.streak} ${c.streak>1?'dias':'dia'}</span><small>${c.done_today?'✓ Cumprido hoje':'Falta cumprir hoje'} · prazo ${left(c.expires_at)}</small>`
  :`<span class="fire">🔥 0</span><small>Apagada · conversem hoje para acender</small>`;
 $('#bMute').textContent=c.muted?'🔕':'🔔';$('#bBlock').hidden=c.kind!=='private'||!c.other_id;$('#bMem').hidden=c.kind!=='group';
 $('#bBlock').textContent=blocked.has(c.other_id)?'✅':'🚫';
}

/* ---------- mensagens ---------- */
async function openChat(id){
 cur=chats.find(c=>c.id===id);if(!cur)return;
 $('#app').classList.add('chat');$('#empty').hidden=true;$('#room').hidden=false;drawHead();drawList();
 replyTo=null;pend=null;drawPrev();$('#msgs').innerHTML='<p class="mut">Carregando mensagens…</p>';
 const {data,error}=await sb.from('messages').select('id,user_id,content,created_at,image_path,reply_to,profiles!user_id(username,display_name,avatar,avatar_url)').eq('conversation_id',id).order('id',{ascending:false}).limit(100);
 if(!cur||cur.id!==id)return;
 if(error)return toast('Erro ao carregar mensagens: '+error.message,1);
 $('#msgs').innerHTML=data.length?'':'<p class="mut">Nenhuma mensagem ainda. Diga oi! 👋</p>';
 data.forEach(m=>cache[m.user_id]=m.profiles);data.reverse().forEach(addMsg);scroll();markRead();loadRx();
}
function addMsgOld(m){
 const box=$('#msgs');if(box.querySelector(`[data-id="${m.id}"]`))return;
 if(!box.querySelector('.msg'))box.innerHTML='';
 const mine=m.user_id===me.id,p=cache[m.user_id]||{username:'?',avatar:''};
 const d=document.createElement('div');d.className='msg'+(mine?' me':'');d.dataset.id=m.id;
 d.innerHTML=`${mine?'':`<span class="who">${esc(p.avatar)} ${esc(p.username)}</span>`}<span>${esc(m.content)}</span><span class="t">${hm(m.created_at)}${mine?' ✓ enviada':''}</span>`;
 box.appendChild(d)}
const scroll=()=>{const b=$('#msgs');b.scrollTop=b.scrollHeight};
const markRead=()=>cur&&sb.rpc('mark_read',{cid:cur.id});
async function sendOld(){
 const t=$('#inp').value.trim();if(!t||!cur)return;$('#inp').value='';
 const {data,error}=await sb.from('messages').insert({conversation_id:cur.id,user_id:me.id,content:t}).select('id,user_id,content,created_at').single();
 if(error){$('#inp').value=t;return toast(error.message.includes('blocked')?'Não é possível enviar: há um bloqueio entre vocês':'Falha ao enviar. Tente novamente.',1)}
 cache[me.id]=me;addMsg(data);scroll();loadChats();
}

/* ---------- realtime ---------- */
function subscribe(){
 sb.channel('app')
 .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async p=>{
  const m=p.new;
  if(m.user_id!==me.id&&!cache[m.user_id]){const {data}=await sb.from('profiles').select('username,display_name,avatar,avatar_url').eq('id',m.user_id).maybeSingle();cache[m.user_id]=data||{username:'?',avatar:''}}
  if(cur&&cur.id===m.conversation_id){addMsg(m);scroll();if(m.user_id!==me.id)markRead()}
  else if(m.user_id!==me.id){const c=chats.find(x=>x.id===m.conversation_id);if(!c||!c.muted)toast(`💬 ${(cache[m.user_id]||{}).username||'Nova mensagem'}: ${m.content.slice(0,40)}`)}
  loadChats()})
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{const el=document.querySelector(`.msg[data-id="${p.old.id}"]`);if(el)el.remove();loadChats()})
 .on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},()=>loadRx())
 .on('postgres_changes',{event:'*',schema:'public',table:'conversation_streaks'},()=>loadChats())
 .on('postgres_changes',{event:'*',schema:'public',table:'conversation_members'},()=>loadChats())
 .subscribe(s=>setConn(s==='SUBSCRIBED'));
}

/* ---------- modais: nova conversa e grupos ---------- */
function newChat(){
 const m=modal(`<h2>Nova conversa</h2><input id="s" placeholder="Buscar pessoas pelo nome (mín. 2 letras)"><div id="res"></div>`);
 const q=s=>m.querySelector(s);let t;
 q('#s').oninput=()=>{clearTimeout(t);t=setTimeout(async()=>{
  const v=q('#s').value.trim().replace(/[%_,()]/g,'');if(v.length<2){q('#res').innerHTML='';return}
  const {data,error}=await sb.from('profiles').select('id,username,avatar').ilike('username','%'+v+'%').neq('id',me.id).limit(20);
  if(error)return toast('Erro na busca',1);
  q('#res').innerHTML=data.length?data.map(u=>`<div class="row" data-id="${u.id}"><div class="av">${esc(u.avatar)}</div><b>${esc(u.username)}</b></div>`).join(''):'<p class="mut">Ninguém encontrado com esse nome.</p>'},300)};
 q('#res').onclick=async e=>{const r=e.target.closest('.row');if(!r)return;
  const {data,error}=await sb.rpc('start_private',{other:r.dataset.id});
  if(error)return toast(error.message.includes('blocked')?'Não é possível conversar: há um bloqueio':'Erro: '+error.message,1);
  m.remove();await loadChats();openChat(data)};
 q('#s').focus();
}
function explore(){
 const m=modal(`<h2>Grupos públicos</h2><input id="s" placeholder="Buscar grupos"><button class="btn alt" id="mk">➕ Criar grupo</button><div id="res"><p class="mut">Carregando…</p></div>`);
 const q=s=>m.querySelector(s);let t;
 const load=async()=>{const {data,error}=await sb.rpc('explore_groups',{q:q('#s').value.trim().replace(/[%_]/g,'')});
  if(error)return toast('Erro ao buscar grupos: '+error.message,1);
  q('#res').innerHTML=data.length?data.map(g=>`<div class="row" style="cursor:default"><div class="av">${esc(g.icon)}</div><div class="mid"><b>${esc(g.name)}</b><small>${esc(g.description||'')} · ${g.members} participante${g.members===1?'':'s'}</small></div>
   <button class="btn sm" data-id="${g.id}">${g.joined?'Abrir':'Entrar'}</button></div>`).join(''):'<p class="mut">Nenhum grupo encontrado. Crie o primeiro!</p>'};
 q('#s').oninput=()=>{clearTimeout(t);t=setTimeout(load,300)};load();
 q('#res').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  const {error}=await sb.rpc('join_group',{cid:b.dataset.id});if(error)return toast('Erro ao entrar: '+error.message,1);
  m.remove();await loadChats();openChat(b.dataset.id)};
 q('#mk').onclick=()=>{const f=modal(`<h2>Criar grupo</h2><input id="n" maxlength="40" placeholder="Nome do grupo"><input id="d" maxlength="200" placeholder="Descrição">
  <select id="i">${ICONS.map(i=>`<option>${i}</option>`).join('')}</select><button class="btn" id="ok">Criar grupo</button>`);
  f.querySelector('#ok').onclick=async()=>{const n=f.querySelector('#n').value.trim();if(n.length<2)return toast('Dê um nome ao grupo (mín. 2 letras)',1);
   const {data,error}=await sb.rpc('create_group',{n,d:f.querySelector('#d').value,i:f.querySelector('#i').value});
   if(error)return toast('Erro ao criar grupo: '+error.message,1);f.remove();await loadChats();openChat(data)}};
}

/* ---------- ações da conversa ---------- */
async function members(){
 const {data,error}=await sb.from('conversation_members').select('profiles(username,avatar)').eq('conversation_id',cur.id);
 if(error)return toast('Erro ao listar participantes',1);
 modal(`<h2>${data.length} participantes</h2>${data.map(x=>`<div class="row" style="cursor:default"><div class="av">${esc(x.profiles.avatar)}</div><b>${esc(x.profiles.username)}</b></div>`).join('')}`);
}
async function toggleMute(){const v=!cur.muted;
 const {error}=await sb.from('conversation_members').update({muted:v}).eq('conversation_id',cur.id).eq('user_id',me.id);
 if(error)return toast('Erro ao silenciar',1);toast(v?'Conversa silenciada':'Som reativado');loadChats()}
async function toggleBlock(){const o=cur.other_id,on=blocked.has(o);
 if(!on&&!confirm('Bloquear este usuário? Vocês não poderão trocar mensagens.'))return;
 const {error}=on?await sb.from('user_blocks').delete().eq('blocker',me.id).eq('blocked',o):await sb.from('user_blocks').insert({blocker:me.id,blocked:o});
 if(error)return toast('Erro: '+error.message,1);on?blocked.delete(o):blocked.add(o);drawHead();toast(on?'Usuário desbloqueado':'Usuário bloqueado')}
async function leave(){
 if(!confirm(cur.kind==='group'?`Sair do grupo "${cur.title}"?`:'Sair desta conversa?'))return;
 const {error}=await sb.from('conversation_members').delete().eq('conversation_id',cur.id).eq('user_id',me.id);
 if(error)return toast('Erro ao sair: '+error.message,1);
 cur=null;$('#room').hidden=true;$('#empty').hidden=false;$('#app').classList.remove('chat');loadChats()}

/* ---------- inicialização ---------- */
async function start(){
 $('#app').classList.add('on');drawMe();
 const {data}=await sb.from('user_blocks').select('blocked').eq('blocker',me.id);blocked=new Set((data||[]).map(b=>b.blocked));
 loadChats();subscribe();setInterval(loadChats,60000);
}
$('#meBtn').onclick=profile;
$('#q').oninput=drawList;$('#bNew').onclick=newChat;$('#bExp').onclick=explore;
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)openChat(r.dataset.id)};
$('#bBack').onclick=()=>$('#app').classList.remove('chat');
$('#bSend').onclick=send;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#inp').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};
$('#bMute').onclick=toggleMute;$('#bBlock').onclick=toggleBlock;$('#bLeave').onclick=leave;$('#bMem').onclick=members;
$('#emo').innerHTML=EMO.map(e=>`<button>${e}</button>`).join('');
$('#bEmo').onclick=()=>$('#emo').classList.toggle('on');
$('#emo').onclick=e=>{const b=e.target.closest('button');if(b){$('#inp').value+=b.textContent;$('#inp').focus()}};
addEventListener('offline',()=>setConn(false));
/* ================= v2: perfil, imagens, reações, respostas ================= */
let rx={},pend=null,replyTo=null,sending=false;
const RX=['❤️','😂','😭','🔥','👍','😮'];
const GAL={'Fofos':['🥰','😊','🥺','😇','🌸','🧸','🍓','💜'],'Engraçados':['🤪','😎','🤡','👻','💩','🤠','🥳','🙃'],'Animais':['🐱','🐶','🦊','🐼','🐸','🦄','🐙','🦁','🐧','🐰'],'Ícones':['🔥','⚡','🌙','🎧','👾','🚀','💎','🎮']};
const avHtml=p=>p&&p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc((p&&p.avatar)||'🙂');
const drawMe=()=>{$('#meName').textContent=me.display_name||me.username;$('#meAv').innerHTML=avHtml(me)};

function addMsg(m){
 const box=$('#msgs');if(box.querySelector(`[data-id="${m.id}"]`))return;
 if(!box.querySelector('.msg'))box.innerHTML='';
 const mine=m.user_id===me.id,p=cache[m.user_id]||{username:'?'};
 const rp=m.reply_to&&box.querySelector(`[data-id="${m.reply_to}"]`);
 const d=document.createElement('div');d.className='msg'+(mine?' mine':'');d.dataset.id=m.id;
 d.innerHTML=`${mine?'':`<span class="who"><span class="mini">${avHtml(p)}</span> ${esc(p.display_name||p.username)} <i>@${esc(p.username)}</i></span>`}
 ${m.reply_to?`<div class="rq">↩️ ${rp?esc((rp.querySelector('.tx').textContent||'📷 Imagem').slice(0,60)):'mensagem'}</div>`:''}
 ${m.image_path?`<img class="pic" data-path="${esc(m.image_path)}" alt="imagem enviada">`:''}
 <span class="tx">${esc(m.content)}</span><span class="t">${hm(m.created_at)}${mine?' ✓ enviada':''}</span><div class="rx"></div>
 <div class="acts"><button data-a="r" title="Reagir">😊</button><button data-a="q" title="Responder">↩️</button><button data-a="c" title="Copiar">📋</button>${mine?'<button data-a="d" title="Apagar">🗑️</button>':''}</div>`;
 box.appendChild(d);signImgs()}
async function signImgs(){
 const els=[...document.querySelectorAll('img.pic[data-path]:not([src])')];if(!els.length)return;
 const {data}=await sb.storage.from('chat-images').createSignedUrls([...new Set(els.map(e=>e.dataset.path))],3600);
 (data||[]).forEach(r=>{if(!r.signedUrl)return;document.querySelectorAll('img.pic[data-path]:not([src])').forEach(el=>{if(el.dataset.path===r.path)el.src=r.signedUrl})})}
async function loadRx(){
 const ids=[...document.querySelectorAll('.msg')].map(x=>+x.dataset.id);if(!ids.length)return;
 const {data}=await sb.from('message_reactions').select('message_id,user_id,emoji').in('message_id',ids);
 rx={};(data||[]).forEach(r=>(rx[r.message_id]=rx[r.message_id]||[]).push(r));
 document.querySelectorAll('.msg').forEach(d=>{const l=rx[d.dataset.id]||[],c={};l.forEach(r=>c[r.emoji]=(c[r.emoji]||0)+1);
  d.querySelector('.rx').innerHTML=Object.entries(c).map(([e,n])=>`<button data-e="${e}" class="${l.some(r=>r.user_id===me.id&&r.emoji===e)?'on':''}">${e} ${n}</button>`).join('')})}
async function react(id,e){
 document.querySelectorAll('.rp').forEach(x=>x.remove());
 const has=(rx[id]||[]).some(r=>r.user_id===me.id&&r.emoji===e);
 const {error}=has?await sb.from('message_reactions').delete().eq('message_id',id).eq('user_id',me.id).eq('emoji',e)
  :await sb.from('message_reactions').insert({message_id:id,user_id:me.id,emoji:e});
 if(error)toast('Erro ao reagir: '+error.message,1);loadRx()}
$('#msgs').onclick=async e=>{
 const d=e.target.closest('.msg');if(!d)return;const id=+d.dataset.id,b=e.target.closest('button'),tx=d.querySelector('.tx').textContent;
 if(e.target.classList.contains('pic')&&e.target.src)return window.open(e.target.src,'_blank');
 if(!b){d.classList.toggle('tap');return}
 if(b.dataset.e)return react(id,b.dataset.e);
 const a=b.dataset.a;
 if(a==='r'){const o=d.querySelector('.rp');if(o)return o.remove();const p=document.createElement('div');p.className='acts rp';p.innerHTML=RX.map(x=>`<button data-e="${x}">${x}</button>`).join('');d.appendChild(p)}
 if(a==='q'){replyTo={id,text:(tx||'📷 Imagem').slice(0,60)};drawPrev();$('#inp').focus()}
 if(a==='c'){try{await navigator.clipboard.writeText(tx);toast('Mensagem copiada')}catch{toast('Não foi possível copiar',1)}}
 if(a==='d'&&confirm('Apagar esta mensagem?')){const {error}=await sb.from('messages').delete().eq('id',id);if(error)return toast('Erro ao apagar: '+error.message,1);d.remove();loadChats()}};
$('#msgs').addEventListener('load',scroll,true);

function drawPrev(){const p=$('#prev');let h='';
 if(replyTo)h+=`<div class="pv">↩️ Respondendo: ${esc(replyTo.text)}<button data-x="r">✕</button></div>`;
 if(pend)h+=`<div class="pv"><img src="${pend.url}" alt="prévia"><button data-x="i">✕ Cancelar imagem</button></div>`;
 p.hidden=!h;p.innerHTML=h}
$('#prev').onclick=e=>{const x=e.target.dataset.x;if(x==='r')replyTo=null;if(x==='i'){URL.revokeObjectURL(pend.url);pend=null;$('#file').value=''}drawPrev()};
$('#bAtt').onclick=()=>{if(!cur)return;$('#file').click()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
 if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){e.target.value='';return toast('Formato inválido. Use JPG, PNG, WEBP ou GIF.',1)}
 if(f.size>5*1048576){e.target.value='';return toast('Imagem muito grande (máx. 5 MB).',1)}
 if(pend)URL.revokeObjectURL(pend.url);pend={file:f,url:URL.createObjectURL(f)};drawPrev()};
async function send(){
 const t=$('#inp').value.trim();if((!t&&!pend)||!cur||sending)return;sending=true;$('#bSend').disabled=true;
 try{let path=null;
  if(pend){path=`${cur.id}/${crypto.randomUUID()}.${pend.file.type.split('/')[1]}`;
   const {error}=await sb.storage.from('chat-images').upload(path,pend.file,{contentType:pend.file.type});if(error)throw error}
  const {data,error}=await sb.from('messages').insert({conversation_id:cur.id,user_id:me.id,content:t,image_path:path,reply_to:replyTo?replyTo.id:null})
   .select('id,user_id,content,created_at,image_path,reply_to').single();
  if(error)throw error;
  $('#inp').value='';$('#inp').style.height='auto';if(pend)URL.revokeObjectURL(pend.url);pend=null;replyTo=null;$('#file').value='';drawPrev();
  cache[me.id]=me;addMsg(data);scroll();loadChats()}
 catch(e){toast(String(e.message).includes('blocked')?'Não é possível enviar: há um bloqueio entre vocês':'Falha ao enviar: '+e.message,1)}
 sending=false;$('#bSend').disabled=false;$('#inp').focus()}

function profile(){
 const mx=Math.max(0,...chats.map(c=>c.streak));
 const m=modal(`<div style="text-align:center"><div class="av big">${avHtml(me)}</div><h2>${esc(me.display_name||me.username)}</h2><p class="mut">@${esc(me.username)}</p>
 <p>${esc(me.bio||'Sem bio ainda.')}</p><p class="mut">Entrou em ${new Date(me.created_at).toLocaleDateString('pt-BR')}<br>👥 ${chats.filter(c=>c.kind==='private').length} contatos · 🔥 maior sequência atual: ${mx} ${mx===1?'dia':'dias'}</p></div>
 <button class="btn" id="ed">✏️ Editar perfil</button>`);
 m.querySelector('#ed').onclick=editProfile}
function editProfile(){
 let av=me.avatar,url=me.avatar_url,file=null;
 const m=modal(`<h2>Editar perfil</h2><div class="av big" id="pv"></div>
 <input id="un" maxlength="24" placeholder="Nome de usuário (@)" value="${esc(me.username)}"><input id="dn" maxlength="40" placeholder="Nome de exibição" value="${esc(me.display_name||'')}">
 <textarea id="bio" rows="2" maxlength="160" placeholder="Bio (até 160 caracteres)">${esc(me.bio||'')}</textarea>
 <div class="row2"><button class="btn alt sm" id="up">📷 Enviar foto</button><button class="btn alt sm" id="rm">Remover foto</button></div>
 <input type="file" id="pf" accept="image/jpeg,image/png,image/webp" hidden>
 ${Object.entries(GAL).map(([k,v])=>`<small class="mut">${k}</small><div class="ics g">${v.map(i=>`<button data-i="${i}">${i}</button>`).join('')}</div>`).join('')}
 <button class="btn" id="sv">Salvar</button>`);
 const q=s=>m.querySelector(s),pv=()=>q('#pv').innerHTML=url?`<img src="${esc(url)}" alt="">`:esc(av);pv();
 m.querySelectorAll('.g').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;av=b.dataset.i;url=null;file=null;pv()});
 q('#up').onclick=()=>q('#pf').click();q('#rm').onclick=()=>{url=null;file=null;pv()};
 q('#pf').onchange=e=>{const f=e.target.files[0];if(!f)return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Formato inválido. Use JPG, PNG ou WEBP.',1);
  if(f.size>2*1048576)return toast('Foto muito grande (máx. 2 MB).',1);file=f;url=URL.createObjectURL(f);pv()};
 q('#sv').onclick=async()=>{const u=q('#un').value.trim();if(u.length<2)return toast('O nome de usuário precisa ter pelo menos 2 caracteres',1);
  q('#sv').disabled=true;
  try{let au=file?null:url;
   if(file){const path=`${me.id}/${Date.now()}.${file.type.split('/')[1]}`;
    const {error}=await sb.storage.from('avatars').upload(path,file,{contentType:file.type});if(error)throw error;
    au=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl}
   const {data,error}=await sb.from('profiles').update({username:u,display_name:q('#dn').value.trim()||null,bio:q('#bio').value.trim()||null,avatar:av,avatar_url:au}).eq('id',me.id).select().single();
   if(error)throw error;me=data;cache[me.id]=me;drawMe();m.remove();toast('Perfil salvo')}
  catch(e){toast(e.code==='23505'?'Esse nome de usuário já está em uso.':'Erro ao salvar: '+e.message,1);q('#sv').disabled=false}}}


(async()=>{
 if(SB_URL.includes('COLE_AQUI')||SB_KEY.includes('COLE_AQUI'))
  return modal('<h2>Configuração pendente</h2><p class="mut">Abra o index.html e preencha SB_URL e SB_KEY no início do script.</p>',true);
 sb=supabase.createClient(new URL(SB_URL.trim()).origin,SB_KEY.trim(),{auth:{persistSession:true,autoRefreshToken:true}});
 const {data:{session}}=await sb.auth.getSession();
 if(session){const {data}=await sb.from('profiles').select().eq('id',session.user.id).maybeSingle();if(data){me=data;return start()}}
 welcome();
})();
</script>
